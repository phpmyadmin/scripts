# Overlay config for the relay.
#
# The container has no IPv6 route, but exim uses its own resolver, so it prefers
# each AAAA record and fails with "Network is unreachable" before falling back
# to IPv4. dns_ipv4_lookup makes it resolve IPv4 only, which removes the failed
# attempt and the log line.
#
# The option has to come before the routers and transports, so it is set here
# and the image's generated config is included after it.
dns_ipv4_lookup = *
.include /var/lib/exim4/config.autogenerated
